version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
    ignore:
      # Keep type definitions aligned with the Node.js 22 runtime baseline.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Major TypeScript upgrades are handled as deliberate migrations.
      - dependency-name: typescript
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - "*"
