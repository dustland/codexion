name: Release macOS App

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm test

      - name: Validate release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate
        env:
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          for name in MACOS_CERTIFICATE_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_SPECIFIC_PASSWORD SPARKLE_PRIVATE_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/codexion-signing.keychain-db"
          printf '%s' "$MACOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | sed -n 's/.*"\(Developer ID Application:[^"]*\)".*/\1/p' | head -n 1)"
          if [[ -z "$IDENTITY" ]]; then
            echo "The imported archive does not contain a Developer ID Application identity with its private key." >&2
            exit 1
          fi
          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build and sign Codexion.app
        run: |
          NODE_BINARY="$(command -v node)" CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            bash scripts/build-macos-app.sh "$VERSION"
          codesign --verify --deep --strict --verbose=2 build/macos/Codexion.app

      - name: Notarize and staple app
        run: |
          APP_ZIP="build/macos/Codexion-v$VERSION-arm64.zip"
          ditto -c -k --keepParent build/macos/Codexion.app "$APP_ZIP"
          xcrun notarytool submit "$APP_ZIP" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple build/macos/Codexion.app
          xcrun stapler validate build/macos/Codexion.app
          rm "$APP_ZIP"
          ditto -c -k --keepParent build/macos/Codexion.app "$APP_ZIP"

      - name: Create, notarize, and verify DMG
        run: |
          CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" bash scripts/create-dmg.sh "$VERSION"
          DMG="build/macos/Codexion-v$VERSION-arm64.dmg"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          codesign --verify --strict --verbose=2 build/macos/Codexion.app
          spctl --assess --type execute --verbose=2 build/macos/Codexion.app
          hdiutil verify "$DMG"
          (cd build/macos && shasum -a 256 "Codexion-v$VERSION-arm64.dmg" > "Codexion-v$VERSION-arm64.dmg.sha256")

      - name: Generate signed Sparkle appcast
        run: |
          RELEASE_DIR="build/macos/sparkle-release"
          mkdir -p "$RELEASE_DIR"
          cp "build/macos/Codexion-v$VERSION-arm64.zip" "$RELEASE_DIR/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            build/dependencies/sparkle-2.9.2/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/lyuai/codexion/releases/download/v$VERSION/" \
              --link "https://github.com/lyuai/codexion/releases/tag/v$VERSION" \
              --maximum-versions 1 \
              --maximum-deltas 0 \
              --disable-signing-warning \
              -o "build/macos/appcast.xml" \
              "$RELEASE_DIR"
          test -s build/macos/appcast.xml

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/extract-release-notes.mjs "$VERSION" > build/macos/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            "build/macos/Codexion-v$VERSION-arm64.dmg" \
            "build/macos/Codexion-v$VERSION-arm64.dmg.sha256" \
            "build/macos/Codexion-v$VERSION-arm64.zip" \
            "build/macos/appcast.xml" \
            --verify-tag \
            --notes-file build/macos/release-notes.md \
            --title "Codexion $GITHUB_REF_NAME"

      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/codexion-signing.keychain-db" 2>/dev/null || true
