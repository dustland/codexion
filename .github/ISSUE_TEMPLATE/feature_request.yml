name: Feature request
description: Propose a focused, reversible Codexion enhancement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What user need is not met today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful outcome, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Reversibility and safety
      description: How is the feature disabled, reset, and kept within Codexion's local security boundary?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the roadmap.
          required: true
